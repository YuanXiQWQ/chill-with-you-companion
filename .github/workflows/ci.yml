name: ci

# 只用 Windows runner：插件是 net472 + BepInEx，测试里还用了 Windows 的目录联接
# （fs.symlinkSync(..., 'junction')）。换到 ubuntu 会把卸载用例最先打死。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 语法检查
        shell: pwsh
        run: |
          $bad = 0
          $files = @('brain.mjs', 'index.js', 'serve.mjs')
          $files += Get-ChildItem lib, test, tools -Recurse -File | Where-Object { $_.Extension -in '.mjs', '.js' } | ForEach-Object { $_.FullName }
          foreach ($f in $files) { node --check $f; if ($LASTEXITCODE -ne 0) { $bad++ } }
          if ($bad -gt 0) { throw "$bad 个文件语法失败" }

      - name: 明文密钥闸门
        run: node tools/scan-secrets.mjs

      - name: 发布体检（清单 / 禁发 / 密钥）
        run: node tools/check-publish.mjs

      - name: 跑测试
        run: node tools/run-tests.mjs